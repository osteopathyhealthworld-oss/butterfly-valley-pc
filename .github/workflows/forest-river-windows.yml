name: Forest river demo - Windows

on:
  push:
    branches:
      - feature/forest-river-demo
    paths:
      - 'forest-river-demo/**'
      - '.github/workflows/forest-river-windows.yml'
  workflow_dispatch:

jobs:
  windows-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
          include-templates: true
      - name: Assemble reproducible demo
        run: python3 forest-river-demo/scripts/assemble.py --output "$RUNNER_TEMP/ForestRiverDemo"
      - name: Import assets
        run: godot --headless --editor --path "$RUNNER_TEMP/ForestRiverDemo" --import --quit
      - name: Verify river and forest instantiation
        run: godot --headless --path "$RUNNER_TEMP/ForestRiverDemo" --script res://demo/smoke_test.gd
      - name: Export Windows application
        run: |
          mkdir -p "$RUNNER_TEMP/ForestRiverDemo/build"
          godot --headless --path "$RUNNER_TEMP/ForestRiverDemo" --export-release 'Windows Desktop' "$RUNNER_TEMP/ForestRiverDemo/build/ForestRiver.exe"
      - name: Package playable demo
        run: |
          cp "$GITHUB_WORKSPACE/forest-river-demo/demo/Start-OpenGL.cmd" "$RUNNER_TEMP/ForestRiverDemo/build/Start-OpenGL.cmd"
          cp "$GITHUB_WORKSPACE/forest-river-demo/demo/Start-Vulkan.cmd" "$RUNNER_TEMP/ForestRiverDemo/build/Start-Vulkan.cmd"
          cd "$RUNNER_TEMP/ForestRiverDemo/build"
          zip -9 -r "$GITHUB_WORKSPACE/ForestRiverDemo-Windows.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ForestRiverDemo-Windows
          path: ForestRiverDemo-Windows.zip
          if-no-files-found: error
          retention-days: 30
